name: release-web

# 打 tag（v*）时自动构建 Web 产物并上传到对应 Release。
# 为什么在 CI 构建：本机网络无法向 GitHub 上传 Release 附件（触发了 abuse 检测 403），
# 由 GitHub 自己的 runner 上传即可绕过；同时保证产物可复现（源码 + 固定 Flutter 版本）。
#
# 手动触发：Actions 页面 → release-web → Run workflow（tag 填已存在的 tag 名）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的 tag（如 v1.1.2）'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # 版本号注入：客户端 --dart-define=CHORD_VERSION，后端 -ldflags -X ...Version
      CHORD_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Build web bundle
        working-directory: client
        run: |
          flutter pub get
          # --no-web-resources-cdn：CanvasKit 本地化（gstatic 在国内不可达）
          # --web-content-hash：文件名带哈希，配合 serveweb 的 immutable 缓存
          # --dart-define=CHORD_VERSION：登录页/设置页显示「客户端版本」（与后端 /api/health 对照）
          flutter build web --release --no-web-resources-cdn --web-content-hash \
            --dart-define=CHORD_VERSION=$CHORD_VERSION

      - name: Build serveweb (linux/amd64)
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/serveweb" ./cmd/serveweb
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X chord/server/internal/handlers.Version=$CHORD_VERSION" \
            -o "$GITHUB_WORKSPACE/chord-server" ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/redisprobe" ./cmd/redisprobe

      - name: Verify version baked into artifacts
        # 防止 --dart-define / -ldflags 注入失配（缺了会变成 dev，线上却看不出来）
        run: |
          main=$(ls client/build/web/main.dart.*.js | head -1)
          grep -q -- "$CHORD_VERSION" "$main" || { echo "web bundle missing $CHORD_VERSION"; exit 1; }
          grep -aq -- "$CHORD_VERSION" chord-server || { echo "chord-server missing $CHORD_VERSION"; exit 1; }
          echo "OK: $CHORD_VERSION found in $main and chord-server"

      - name: Package chord-web-update.tar.gz
        run: |
          mkdir -p pkg/web
          cp -r client/build/web/. pkg/web/
          cp serveweb pkg/web/serveweb
          chmod +x pkg/web/serveweb
          tar czf chord-web-update.tar.gz -C pkg web
          ls -lh chord-web-update.tar.gz
          tar tzf chord-web-update.tar.gz | grep -E "web/serveweb$|web/main\.dart\..*js$" | head -3

      # 全量部署包（install.sh 要求：chord-server / serveweb / web/index.html / update.sh）
      - name: Package chord-deploy.tar.gz
        run: |
          mkdir -p pkg/package
          cp chord-server serveweb redisprobe pkg/package/
          cp deploy/install.sh deploy/update.sh pkg/package/
          cp "deploy/部署说明.md" pkg/package/
          cp -r client/build/web pkg/package/web
          chmod +x pkg/package/chord-server pkg/package/serveweb pkg/package/redisprobe
          tar czf chord-deploy.tar.gz -C pkg package
          ls -lh chord-deploy.tar.gz
          tar tzf chord-deploy.tar.gz | head -5

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            chord-web-update.tar.gz
            chord-deploy.tar.gz
            deploy/update.sh
          fail_on_unmatched_files: true
