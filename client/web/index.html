<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chord - 一个模仿 Discord 的实时聊天产品">

  <!-- 移动端铺满全屏（刘海/手势条交给 SafeArea 处理） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chord">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chord - 即时聊天</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 加载骨架：Flutter 引擎启动前的底色，避免白屏闪烁 */
    html, body { margin: 0; padding: 0; background: #1E1F22; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <!-- 剪贴板图片粘贴（Web）：浏览器 FileReader 在 Dart 侧流事件不可靠，
       这里在 JS 里读成 dataURL，再以自定义事件交给 Dart（见 clipboard_image_web.dart）。
       纯文本粘贴不受影响（只在图片分支 preventDefault）。 -->
  <script>
    (function () {
      document.addEventListener('paste', function (e) {
        var items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          if (it.kind === 'file' && it.type && it.type.indexOf('image/') === 0) {
            var f = it.getAsFile();
            if (!f) continue;
            var fr = new FileReader();
            fr.onloadend = function () {
              window.dispatchEvent(new CustomEvent('chord-paste-image', {
                detail: fr.result
              }));
            };
            fr.readAsDataURL(f);
            e.preventDefault();
            return;
          }
        }
      });
    })();
  </script>
</body>
</html>
